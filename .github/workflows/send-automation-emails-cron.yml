name: Send automation emails

on:
  # Agendamento migrado para cron-job.org em 2026-09-26 — o GitHub Actions
  # não estava disparando na frequência configurada quando havia muitos
  # workflows agendados no mesmo repositório (rodava a cada 2-5h em vez de
  # a cada 5-10min). Mantido aqui só pra rodar manualmente se precisar.
  # schedule:
  #   # A cada 10 min, fora da marca redonda (o GitHub atrasa/pula cron em :00).
  #   - cron: "5,15,25,35,45,55 * * * *"
  workflow_dispatch: {}

jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - name: Call send-automation-emails endpoint
        run: |
          curl --fail --show-error --silent \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            https://www.modocriador.com.br/api/cron/send-automation-emails
