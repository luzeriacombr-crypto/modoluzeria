name: Publish scheduled LinkedIn posts

on:
  # Agendamento migrado para cron-job.org em 2026-09-26 — o GitHub Actions
  # não estava disparando na frequência configurada quando havia muitos
  # workflows agendados no mesmo repositório (rodava a cada 2-5h em vez de
  # a cada 5-10min). Mantido aqui só pra rodar manualmente se precisar.
  # schedule:
  #   - cron: "8,18,28,38,48,58 * * * *"
  workflow_dispatch: {}

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Call publish endpoint
        run: |
          curl --fail --show-error --silent \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            https://www.modocriador.com.br/api/cron/publish-linkedin
