name: Compute agency ranking

on:
  schedule:
    # Uma vez por dia, 04:20 UTC (madrugada no Brasil, logo depois da
    # limpeza de retenção às 04:10).
    - cron: "20 4 * * *"
  workflow_dispatch: {}

jobs:
  compute:
    runs-on: ubuntu-latest
    steps:
      - name: Call compute-agency-ranks endpoint
        run: |
          curl --fail --show-error --silent \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            https://www.modocriador.com.br/api/cron/compute-agency-ranks
